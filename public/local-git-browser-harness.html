<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Local Git browser harness</title>
  </head>
  <body>
    <pre id="result">正在运行…</pre>
    <script type="module">
      import { LocalGitRepository } from '/src/features/docs/providers/LocalGitRepository.ts';

      const output = document.querySelector('#result');
      const service = new URLSearchParams(location.search).get('service') || 'http://127.0.0.1:4180';
      const verifyHistory = new URLSearchParams(location.search).get('history') === '1';
      let stage = '准备文件索引';

      try {
        stage = '读取文件索引';
        const paths = await fetch(`${service}/index`).then(async (response) => {
          if (!response.ok) throw new Error(await response.text());
          return response.json();
        });
        const repository = new LocalGitRepository(async (path) => {
          const response = await fetch(`${service}/file?path=${encodeURIComponent(path)}`);
          return response.ok ? new Uint8Array(await response.arrayBuffer()) : null;
        }, () => paths);
        stage = '读取版本引用';
        const refs = await repository.getRefs();
        stage = '遍历文档树';
        const files = await repository.listFiles();
        let document = files.find((path) => path.startsWith('docs/') && path.endsWith('.md'));
        if (!document) throw new Error('HEAD 中没有 Markdown 文档。');
        let commits = [];
        if (verifyHistory) {
          stage = '定位有历史的 Markdown 文档';
          for (const candidate of files.filter((path) => path.startsWith('docs/') && path.endsWith('.md'))) {
            const candidateCommits = await repository.log(candidate, undefined, 10);
            if (candidateCommits.length >= 2) {
              document = candidate;
              commits = candidateCommits;
              break;
            }
          }
          if (commits.length < 2) throw new Error('测试仓库中至少需要一个有两个 Commit 的 Markdown 文件。');
        }
        stage = '读取 Markdown 文档';
        const contents = await repository.readFile(document);
        let history = 0;
        let patch = false;
        if (verifyHistory) {
          stage = '读取文件历史';
          history = commits.length;
          stage = '比较文件历史';
          patch = Boolean((await repository.compare(document, commits[1].oid, commits[0].oid)).patch.trim());
          if (!patch) throw new Error('测试仓库的两个历史版本没有产生 Diff。');
        }
        output.textContent = JSON.stringify({ ok: true, refs: refs.length, files: files.length, document, bytes: contents.byteLength, history, patch }, null, 2);
      } catch (error) {
        output.textContent = JSON.stringify({ ok: false, stage, message: error instanceof Error ? error.message : String(error), stack: error instanceof Error ? error.stack : undefined }, null, 2);
      }
    </script>
  </body>
</html>
